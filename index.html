<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haliotis asinina Hatchery Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-16">

    <header class="bg-teal-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="font-bold text-sm">Hatchery Suite</h1>
            <span id="conn-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">Standalone</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-4">
        <div class="flex bg-slate-200 p-1 rounded-xl mb-4 gap-1">
            <button onclick="switchTab('spawning')" id="tab-btn-spawning" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-teal-800 shadow">Spawning</button>
            <button onclick="switchTab('purchasing')" id="tab-btn-purchasing" class="flex-1 py-2 text-xs font-bold rounded-lg">Purchasing</button>
            <button onclick="switchTab('manager')" id="tab-btn-manager" class="flex-1 py-2 text-xs font-bold rounded-lg">Manager</button>
        </div>

        <div id="tab-content-spawning" class="space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-600">Start (Date/Time)</label>
                    <input type="date" id="spawn-period-start-date" class="w-full p-2 text-xs border rounded-lg">
                    <input type="time" id="spawn-period-start-time" class="w-full p-2 text-xs border rounded-lg mt-1">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-600">End (Date/Time)</label>
                    <input type="date" id="spawn-period-end-date" class="w-full p-2 text-xs border rounded-lg">
                    <input type="time" id="spawn-period-end-time" class="w-full p-2 text-xs border rounded-lg mt-1">
                </div>
            </div>
            </div>

        <div id="tab-content-manager" class="hidden">
            <div id="pin-barrier" class="text-center py-10">
                <input type="password" id="manager-pin" placeholder="PIN" class="p-2 border rounded text-center w-20">
                <button onclick="unlockTerminalLogs()" class="bg-teal-800 text-white px-4 py-2 rounded text-xs font-bold">Access</button>
            </div>
            <div id="logs-unlocked-panel" class="hidden">
                <table class="min-w-full text-[10px] text-left">
                    <thead class="bg-slate-100 uppercase font-bold">
                        <tr>
                            <th class="px-2 py-2">Date</th>
                            <th class="px-2 py-2">Eggs</th>
                            <th class="px-2 py-2">DO | pH | Sal</th> <th class="px-2 py-2">Sorting</th>
                        </tr>
                    </thead>
                    <tbody id="spawning-log-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Updated rendering logic for Manager Dashboard
        function renderTerminalLogsEngine() {
            const tbody = document.getElementById('spawning-log-body');
            tbody.innerHTML = cachedSpawning.map(r => `
                <tr class="border-b">
                    <td class="px-2 py-2">${formatCleanDateOnly(r.date)}</td>
                    <td class="px-2 py-2">${Number(r.totalEggs).toLocaleString()}</td>
                    <td class="px-2 py-2">${r.wq1AvgDo} | ${r.wq1AvgPh} | ${r.wq1AvgSal}</td> <td class="px-2 py-2">F:${r.f1Pcs} | M:${r.malePcs}</td>
                </tr>
            `).join('');
        }
        
        function formatCleanDateOnly(rawDate) {
            return rawDate ? rawDate.split('T')[0] : '';
        }
        
        // ... include other logic (handleSpawningSubmit, switchTab, etc.)
    </script>
</body>
</html>
